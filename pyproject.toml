[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mwana-ai-engine"
version = "0.1.0"
description = "Reusable maternal-child health AI engine for Zimbabwe"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Mwana Technologies", email = "hello@mwanahealth.com"},
]
keywords = [
    "maternal-health",
    "child-health",
    "zimbabwe",
    "imci",
    "triage",
    "immunization",
    "who",
    "epi",
    "mwana",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://mwanahealth.com"
Repository = "https://github.com/Mwana-Health/mwana-ai-engine"
Issues = "https://github.com/Mwana-Health/mwana-ai-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mwana_ai_engine = ["py.typed"]
